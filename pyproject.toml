[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencebench"
version = "0.1.0"
description = "Offline code retrieval and citation regression benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Cem Ali Akgül"}]
dependencies = []

[project.scripts]
evidencebench = "evidencebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

