name: Offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock ruff==0.13.3
      - run: ruff check src tests
      - run: python -m unittest discover -s tests -v
      - run: evidencebench validate corpus/smoke
      - run: evidencebench validate corpus/evaluation
      - run: evidencebench demo --out reports/demo
